[package]
name = "dictation"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/dictation.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-tar.workspace = true
async_zip.workspace = true
cpal.workspace = true
futures.workspace = true
http_client.workspace = true
log.workspace = true
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-28"] }
parakeet-rs = { version = "=0.3.8", default-features = false, features = ["cpu", "load-dynamic", "api-28"] }
rubato = "=0.16.2"
sha2.workspace = true

[dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
