name: Report a crash
description: Wu is crashing or freezing or hanging.
type: Crash
labels: "state:needs triage"
body:
  - type: textarea
    attributes:
      label: Reproduction steps
      description: A step-by-step description of how to reproduce the crash from a **clean Wu install**. The more context you provide, the easier it is to find and fix the problem fast.
      placeholder: |
        1. Start Wu
        2. Perform an action
        3. Wu crashes
    validations:
      required: true
  - type: textarea
    attributes:
      label: Wu version and system specs
      description: |
        Open the command palette in Wu, then type “wu: copy system specs into clipboard”.
      placeholder: |
        Wu: v1.0.8
        OS: macOS 15.1
        Memory: 36 GiB
        Architecture: aarch64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Attach Wu log file
      description: |
        Open the command palette in Wu, then type `wu: open log` to see the last 1000 lines. Or type `wu: reveal log in file manager` in the command palette to reveal the log file itself.

        ⚠️ **Please review your log file for secrets (API keys, tokens, etc.) and partially or fully redact them before posting.**
      value: |
        <details><summary>Wu.log</summary>

        <!-- Paste your log inside the code block. -->
        ```log

        ```

        </details>
    validations:
      required: false
