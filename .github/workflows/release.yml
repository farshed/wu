name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  bundle_mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        if: matrix.arch == 'aarch64'
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/zed/Cargo.toml version ${version}"
            exit 1
          fi
      - name: Bundle
        run: script/bundle-mac ${{ matrix.target }}
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/Wu-${{ matrix.arch }}.dmg
            target/wu-remote-server-macos-${{ matrix.arch }}.gz
