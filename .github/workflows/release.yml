name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  bundle_mac:
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/zed/Cargo.toml version ${version}"
            exit 1
          fi
      - name: Bundle
        run: script/bundle-mac aarch64-apple-darwin
      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/aarch64-apple-darwin/release/Wu-aarch64.dmg
            target/wu-remote-server-macos-aarch64.gz
