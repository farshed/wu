<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Wu — geometric reindeer W</title>
  <desc>A flat heraldic reindeer head whose four antler tips and central forehead establish a W rhythm.</desc>

  <!-- Wu tile -->
  <path
    fill="#171717"
    d="M292 64C160 64 64 160 64 292v440c0 132 96 228 228 228h440c132 0 228-96 228-228V292C960 160 864 64 732 64H292Z"
  />

  <!-- The mark's measured bounds are centered at (512, 512). -->
  <g transform="translate(0 38)">
    <!-- Left antler: two bold tines, designed to survive at 16–32 px. -->
    <path
      fill="#F2EEE4"
      d="m470 476-92-82-66-40-72-86-42-92 54-24 48 104 34 30 10-112 58 4-18 166 116 82-30 50Z"
    />

    <!-- Right antler mirrors the left and completes the W silhouette. -->
    <path
      fill="#F2EEE4"
      d="m554 476 92-82 66-40 72-86 42-92-54-24-48 104-34 30-10-112-58 4 18 166-116 82 30 50Z"
    />

    <!-- Ears are broad triangular shoulders, not illustrative details. -->
    <path fill="#F2EEE4" d="m438 412-118-54 28 114 92 38 20-56-22-42Z" />
    <path fill="#F2EEE4" d="m586 412 118-54-28 114-92 38-20-56 22-42Z" />

    <!-- Tapered, faceted head. No eyes, nose, or mascot features. -->
    <path
      fill="#F2EEE4"
      d="m512 300-92 94 22 252 70 150 70-150 22-252-92-94Z"
    />

    <!-- Editor caret cut through the forehead. -->
    <path fill="#171717" d="M500 342h24v214l-12 24-12-24V342Z" />
  </g>
</svg>
